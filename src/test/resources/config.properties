# ============================================================
# Configuração dos testes
# Qualquer valor pode ser trocado na linha de comando, ex.:
#   mvn test -Dbrowser=firefox -Dheadless=true
# ============================================================

# Sistema testado: site público de demonstração da Sauce Labs
base.url=https://www.saucedemo.com/

# Navegador: chrome | firefox | edge
browser=chrome

# true = roda sem abrir a janela (usado no CI)
headless=false

# Tempo máximo (em segundos) de espera por um elemento
timeout.seconds=10
